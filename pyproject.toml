[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banglab"
version = "0.0.0"
description = "Evidence-bounded clay and shotgun modelling experiments"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
